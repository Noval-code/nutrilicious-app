app = "nutrilicious-backend"
primary_region = "sin"

[build]

[env]
  FLASK_PORT = "8080"
  FLASK_DEBUG = "False"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
